services:
  postgres:
    image: postgres:16-alpine
    container_name: dia-postgres
    environment:
      POSTGRES_USER: dia
      POSTGRES_PASSWORD: dia
      POSTGRES_DB: dia
    ports:
      - "5433:5432"
    volumes:
      - dia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dia -d dia"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  dia-pgdata:
