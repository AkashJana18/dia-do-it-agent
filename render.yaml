services:
  - type: web
    name: dia-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: cd backend && npm install --include=dev && npm run db:generate && npm run build
    startCommand: cd backend && bash start.sh
    healthCheckPath: /api/health
    disk:
      name: dia-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/dev.db
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SARVAM_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: LLM_REASONING_EFFORT
        value: none
      - key: MAX_AUDIO_MB
        value: "4"
